name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run local quality gate
        run: npm run quality:local

  integration-api:
    name: API integration
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: bello_admin
          POSTGRES_PASSWORD: ci-admin-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: postgres
          BELLO_DEV_APP_PASSWORD: ci-dev-app-${{ github.run_id }}-${{ github.run_attempt }}
          BELLO_DEV_MIGRATOR_PASSWORD: ci-dev-migrator-${{ github.run_id }}-${{ github.run_attempt }}
          BELLO_DEV_BOOTSTRAP_PASSWORD: ci-dev-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
          BELLO_DEV_AUDIT_MAINTENANCE_PASSWORD: ci-dev-audit-maintenance-${{ github.run_id }}-${{ github.run_attempt }}
          BELLO_SHADOW_MIGRATOR_PASSWORD: ci-shadow-migrator-${{ github.run_id }}-${{ github.run_attempt }}
          BELLO_TEST_APP_PASSWORD: ci-test-app-${{ github.run_id }}-${{ github.run_attempt }}
          BELLO_TEST_MIGRATOR_PASSWORD: ci-test-migrator-${{ github.run_id }}-${{ github.run_attempt }}
          BELLO_TEST_BOOTSTRAP_PASSWORD: ci-test-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
          BELLO_TEST_AUDIT_MAINTENANCE_PASSWORD: ci-test-audit-maintenance-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -q -U bello_admin -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
          --health-start-period 5s
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate --workspace=@bello/api

      - name: Provision PostgreSQL databases and roles
        run: >-
          docker exec -i "${{ job.services.postgres.id }}"
          bash -s < infra/postgres/init/01-init-databases.sh

      - name: Apply Prisma migrations to clean databases
        env:
          CI_DB_PORT: ${{ job.services.postgres.ports[5432] }}
        run: |
          migration_url() {
            CI_DB_NAME="$1" CI_DB_USER="$2" CI_DB_PASSWORD="$3" node -e '
              const url = new URL(`postgresql://${process.env.CI_DB_USER}@127.0.0.1/${process.env.CI_DB_NAME}`);
              url.port = process.env.CI_DB_PORT;
              url.password = process.env.CI_DB_PASSWORD;
              process.stdout.write(url.toString());
            '
          }

          MIGRATION_DATABASE_URL="$(migration_url \
            bello_dev bello_dev_migrator \
            "ci-dev-migrator-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")" \
            npm exec --workspace=@bello/api -- prisma migrate deploy

          MIGRATION_DATABASE_URL="$(migration_url \
            bello_test bello_test_migrator \
            "ci-test-migrator-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")" \
            npm exec --workspace=@bello/api -- prisma migrate deploy

      - name: Run API E2E tests
        run: |
          DATABASE_URL="$(
            CI_DB_PASSWORD="ci-dev-app-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            CI_DB_PORT="${{ job.services.postgres.ports[5432] }}" \
            node -e '
              const url = new URL("postgresql://bello_dev_app@127.0.0.1/bello_dev");
              url.port = process.env.CI_DB_PORT;
              url.password = process.env.CI_DB_PASSWORD;
              process.stdout.write(url.toString());
            '
          )"
          export DATABASE_URL
          npm run test:e2e

      - name: Setup transaction fixture
        run: |
          docker exec -i "${{ job.services.postgres.id }}" sh -ec '
            PGPASSWORD="$BELLO_TEST_MIGRATOR_PASSWORD" exec psql \
              -v ON_ERROR_STOP=1 -h 127.0.0.1 \
              -U bello_test_migrator -d bello_test
          ' <<'SQL'
          BEGIN;
          DO $$
          BEGIN
            IF current_database() <> 'bello_test' OR current_user <> 'bello_test_migrator' THEN
              RAISE EXCEPTION 'unexpected database identity';
            END IF;
            IF to_regclass('public._f022c_transaction_probe') IS NOT NULL THEN
              RAISE EXCEPTION 'transaction probe table already exists';
            END IF;
          END
          $$;
          CREATE TABLE public._f022c_transaction_probe (
            run_id text NOT NULL,
            step integer NOT NULL,
            PRIMARY KEY (run_id, step)
          );
          REVOKE ALL ON TABLE public._f022c_transaction_probe FROM PUBLIC;
          GRANT SELECT, INSERT, DELETE
            ON TABLE public._f022c_transaction_probe TO bello_test_app;
          COMMIT;
          SQL

      - name: Run transaction tests
        run: |
          DATABASE_URL="$(
            CI_DB_PASSWORD="ci-test-app-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            CI_DB_PORT="${{ job.services.postgres.ports[5432] }}" \
            node -e '
              const url = new URL("postgresql://bello_test_app@127.0.0.1/bello_test");
              url.port = process.env.CI_DB_PORT;
              url.password = process.env.CI_DB_PASSWORD;
              process.stdout.write(url.toString());
            '
          )"
          export DATABASE_URL
          npm run test:transaction

      - name: Run identity and session PostgreSQL tests
        env:
          CI_DB_PORT: ${{ job.services.postgres.ports[5432] }}
        run: |
          database_url() {
            CI_DB_USER="$1" CI_DB_PASSWORD="$2" node -e '
              const url = new URL(`postgresql://${process.env.CI_DB_USER}@127.0.0.1/bello_test`);
              url.port = process.env.CI_DB_PORT;
              url.password = process.env.CI_DB_PASSWORD;
              process.stdout.write(url.toString());
            '
          }

          DATABASE_URL="$(database_url \
            bello_test_app \
            "ci-test-app-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")"
          BOOTSTRAP_DATABASE_URL="$(database_url \
            bello_test_bootstrap \
            "ci-test-bootstrap-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")"
          MIGRATION_DATABASE_URL="$(database_url \
            bello_test_migrator \
            "ci-test-migrator-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")"
          MAINTENANCE_DATABASE_URL="$(database_url \
            bello_test_audit_maintenance \
            "ci-test-audit-maintenance-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")"
          ADMIN_TEST_DATABASE_URL="$(CI_DB_USER=bello_admin \
            CI_DB_PASSWORD="ci-admin-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            node -e '
              const url = new URL(`postgresql://${process.env.CI_DB_USER}@127.0.0.1/postgres`);
              url.port = process.env.CI_DB_PORT;
              url.password = process.env.CI_DB_PASSWORD;
              process.stdout.write(url.toString());
            ')"
          export DATABASE_URL BOOTSTRAP_DATABASE_URL
          export MIGRATION_DATABASE_URL MAINTENANCE_DATABASE_URL
          export BELLO_EPHEMERAL_TEST_DATABASE=true

          npm run test:f1a1 --workspace=@bello/api
          npm run test:f1a2:provider --workspace=@bello/api
          npm run test:f1a2:cli --workspace=@bello/api
          ADMIN_TEST_DATABASE_URL="$ADMIN_TEST_DATABASE_URL" npm run test:f1b:sessions --workspace=@bello/api
          npm run test:f1b:persistence --workspace=@bello/api
          npm run test:f1b:failed-login --workspace=@bello/api
          npm run test:f1b:authentication --workspace=@bello/api
          ADMIN_TEST_DATABASE_URL="$ADMIN_TEST_DATABASE_URL" npm run test:f1b:password-recovery-foundation --workspace=@bello/api

  required:
    name: Required
    if: always()
    needs: [quality, integration-api]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Verify required jobs
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          INTEGRATION_API_RESULT: ${{ needs['integration-api'].result }}
        run: |
          if [[ "$QUALITY_RESULT" != "success" || "$INTEGRATION_API_RESULT" != "success" ]]; then
            printf 'Required jobs failed: quality=%s integration-api=%s\n' \
              "$QUALITY_RESULT" "$INTEGRATION_API_RESULT" >&2
            exit 1
          fi
